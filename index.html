<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd600">
  <title>Mystery Box Game</title>
  <style>
    :root {
      --yellow: #ffd600;
      --yellow-deep: #ffb800;
      --red: #e10600;
      --red-dark: #8b0000;
      --blue: #0756c9;
      --ink: #281500;
      --white: #fffdf4;
      --shadow: 0 1.4vh 0 rgba(116, 43, 0, .22), 0 2.4vh 5vh rgba(105, 28, 0, .24);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-rounded, "Arial Rounded MT Bold", Arial, sans-serif;
      color: var(--ink);
      background: var(--yellow);
      user-select: none;
    }

    button { font: inherit; }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(.2px);
      opacity: .55;
    }

    body::before {
      width: 47vw;
      height: 47vw;
      top: -27vw;
      left: -12vw;
      border: 8vw solid rgba(255,255,255,.38);
    }

    body::after {
      width: 42vw;
      height: 42vw;
      right: -18vw;
      bottom: -28vw;
      border: 7vw solid rgba(225,6,0,.13);
    }

    .app {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      min-height: 420px;
      padding: clamp(12px, 2vh, 28px) clamp(18px, 3vw, 58px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(8px, 1.4vh, 18px);
      background:
        radial-gradient(circle at 50% 46%, rgba(255,255,255,.95) 0 1.5%, transparent 1.6%),
        radial-gradient(circle at 50% 48%, rgba(255,255,255,.52) 0 20%, transparent 47%),
        linear-gradient(145deg, #fff151 0%, var(--yellow) 45%, #ffbd00 100%);
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .17;
      background-image:
        radial-gradient(circle, #e10600 0 2px, transparent 3px),
        radial-gradient(circle, #fff 0 2px, transparent 3px);
      background-size: 95px 95px, 125px 125px;
      background-position: 10px 16px, 42px 58px;
    }

    .header {
      min-height: clamp(76px, 12vh, 128px);
      display: grid;
      grid-template-columns: minmax(130px, 20vw) 1fr minmax(130px, 20vw);
      align-items: center;
      gap: 2vw;
    }

    .brand {
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .brand-logo {
      max-width: min(210px, 18vw);
      max-height: clamp(54px, 9vh, 96px);
      object-fit: contain;
      filter: drop-shadow(0 .5vh .4vh rgba(0,0,0,.14));
    }

    .brand-fallback {
      display: none;
      color: var(--red);
      font-weight: 1000;
      font-size: clamp(22px, 3.5vw, 56px);
      letter-spacing: -.07em;
      text-shadow: 0 .25vh 0 #fff;
    }

    .headline {
      grid-column: 2;
      grid-row: 1;
      text-align: center;
      line-height: .95;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: .6vh;
      padding: .55vh 1.2vw;
      border: 2px solid rgba(225,6,0,.18);
      border-radius: 99px;
      color: var(--red);
      background: rgba(255,255,255,.72);
      font-size: clamp(10px, 1vw, 16px);
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--red);
      font-size: clamp(26px, 4.2vw, 72px);
      font-weight: 1000;
      letter-spacing: -.055em;
      text-transform: uppercase;
      text-shadow: 0 .28vh 0 #fff, 0 .7vh 0 rgba(150,0,0,.12);
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(7px, 1vh, 13px);
      place-items: center;
    }

    .instruction {
      margin: 0;
      color: #6b2900;
      text-align: center;
      font-size: clamp(14px, 1.5vw, 25px);
      font-weight: 900;
    }

    .instruction span { color: var(--red); }

    .boxes {
      width: min(1120px, 82vw);
      height: 100%;
      max-height: 58vh;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: clamp(12px, 2.4vh, 28px) clamp(16px, 2.5vw, 38px);
      perspective: 1000px;
    }

    .box-card {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: clamp(12px, 1.2vw, 22px);
      color: inherit;
      background: transparent;
      cursor: pointer;
      outline: none;
      transform-style: preserve-3d;
      transition: transform .22s ease, filter .25s ease, opacity .25s ease;
    }

    .box-card:hover:not(:disabled),
    .box-card:focus-visible:not(:disabled) { transform: translateY(-1.2vh) scale(1.025); }
    .box-card:focus-visible { box-shadow: 0 0 0 .55vh #fff, 0 0 0 1vh var(--blue); }
    .box-card:disabled { cursor: default; }
    .box-card.not-chosen { opacity: .35; filter: saturate(.45); transform: scale(.93); }

    .card-inner {
      position: absolute;
      inset: 0;
      border: clamp(3px, .3vw, 6px) solid #fff;
      border-radius: inherit;
      overflow: hidden;
      background: linear-gradient(145deg, #f62a22 0%, var(--red) 55%, #ae0000 100%);
      box-shadow: var(--shadow);
    }

    .box-card:nth-child(even) .card-inner {
      background: linear-gradient(145deg, #1674ed 0%, var(--blue) 58%, #003889 100%);
    }

    .card-inner::before,
    .card-inner::after {
      content: "";
      position: absolute;
      z-index: 1;
      background: linear-gradient(90deg, #ffb400, #fff27b 50%, #ffae00);
      box-shadow: 0 0 1vh rgba(96,35,0,.25);
    }

    .card-inner::before { width: 15%; height: 100%; left: 42.5%; top: 0; }
    .card-inner::after { width: 100%; height: 18%; left: 0; top: 42%; }

    .lid {
      position: absolute;
      z-index: 5;
      left: -3%;
      top: 2%;
      width: 106%;
      height: 27%;
      border: clamp(2px, .2vw, 4px) solid rgba(255,255,255,.9);
      border-radius: 1.2vh;
      background: inherit;
      box-shadow: 0 .6vh .7vh rgba(66,0,0,.28);
      transform-origin: 88% 100%;
    }

    .lid::before {
      content: "";
      position: absolute;
      top: -43%;
      left: 50%;
      width: 26%;
      height: 74%;
      border: clamp(6px, .65vw, 12px) solid #ffe65e;
      border-radius: 50% 50% 8% 50%;
      transform: translateX(-93%) rotate(18deg);
    }

    .lid::after {
      content: "";
      position: absolute;
      top: -43%;
      left: 50%;
      width: 26%;
      height: 74%;
      border: clamp(6px, .65vw, 12px) solid #ffe65e;
      border-radius: 50% 50% 50% 8%;
      transform: translateX(-7%) rotate(-18deg);
    }

    .box-smile {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 52%;
      width: clamp(58px, 6vw, 100px);
      max-height: 60%;
      aspect-ratio: 1;
      object-fit: contain;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      filter: drop-shadow(0 .75vh .45vh rgba(67,0,0,.35));
      transition: transform .22s ease;
    }

    .box-card:hover:not(:disabled) .box-smile {
      transform: translate(-50%, -54%) scale(1.08);
    }

    .choose-label {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 7%;
      transform: translateX(-50%);
      color: #fff;
      font-size: clamp(9px, .85vw, 15px);
      font-weight: 1000;
      letter-spacing: .13em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .prize-inside {
      position: absolute;
      z-index: 3;
      inset: 10% 7% 7%;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1vh;
      border-radius: 1.2vh;
      color: var(--ink);
      background: #fff;
      opacity: 0;
      transform: scale(.55) translateY(20%);
    }

    .prize-inside .emoji { font-size: clamp(34px, 5vw, 82px); line-height: 1; }
    .prize-inside img { max-width: 65%; max-height: 10vh; object-fit: contain; }
    .prize-inside strong { font-size: clamp(12px, 1.3vw, 22px); text-transform: uppercase; }

    .box-card.opening { z-index: 10; animation: box-pop .9s cubic-bezier(.18,.89,.32,1.28) both; }
    .box-card.opening .lid { animation: lid-open .75s .18s cubic-bezier(.2,.85,.3,1) forwards; }
    .box-card.opening .box-smile,
    .box-card.opening .choose-label,
    .box-card.revealed .box-smile,
    .box-card.revealed .choose-label { opacity: 0; }
    .box-card.opening .prize-inside,
    .box-card.revealed .prize-inside { animation: prize-in .55s .46s ease-out forwards; }

    @keyframes box-pop {
      0% { transform: scale(1); }
      32% { transform: scale(.9) rotate(-2deg); }
      62% { transform: scale(1.1) rotate(2deg); }
      100% { transform: scale(1.04); }
    }

    @keyframes lid-open {
      0% { transform: translate(0,0) rotate(0); }
      100% { transform: translate(20%, -170%) rotate(28deg); opacity: .2; }
    }

    @keyframes prize-in {
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .controls {
      min-height: clamp(48px, 7vh, 76px);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 1.4vw, 22px);
    }

    .control-btn {
      min-width: clamp(128px, 12vw, 190px);
      padding: clamp(9px, 1.15vh, 15px) 1.5vw;
      border: .3vh solid #fff;
      border-radius: 999px;
      color: #fff;
      background: var(--red);
      box-shadow: 0 .55vh 0 var(--red-dark);
      font-size: clamp(12px, 1.1vw, 18px);
      font-weight: 1000;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .control-btn.secondary { color: var(--red); background: #fff; box-shadow: 0 .55vh 0 #d6a500; }
    .control-btn:hover { transform: translateY(-.25vh); }
    .control-btn:active { transform: translateY(.4vh); box-shadow: 0 .15vh 0 var(--red-dark); }
    .control-btn:disabled { opacity: .45; cursor: default; }

    .sound-btn {
      width: clamp(42px, 4.2vw, 62px);
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border-radius: 50%;
    }

    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 3vh 3vw;
      background: rgba(49,12,0,.68);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .modal.show { opacity: 1; visibility: visible; }

    .result-card {
      position: relative;
      width: min(650px, 75vw);
      min-height: min(520px, 70vh);
      padding: clamp(22px, 4vh, 52px) clamp(28px, 4vw, 62px);
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1.5vh;
      overflow: hidden;
      border: clamp(5px, .6vw, 10px) solid #fff;
      border-radius: clamp(24px, 3vw, 52px);
      background: linear-gradient(150deg, #fffdeb 0%, #fff 64%, #fff2a7 100%);
      box-shadow: 0 4vh 10vh rgba(0,0,0,.38), inset 0 0 0 1vh var(--yellow);
      text-align: center;
      transform: scale(.65) rotate(-3deg);
      transition: transform .55s cubic-bezier(.18,.89,.32,1.28);
    }

    .modal.show .result-card { transform: scale(1) rotate(0); }

    .result-card::before {
      content: "";
      position: absolute;
      width: 20vw;
      height: 20vw;
      top: -14vw;
      right: -10vw;
      border: 4vw solid rgba(225,6,0,.08);
      border-radius: 50%;
    }

    .result-kicker {
      color: var(--red);
      font-size: clamp(14px, 1.5vw, 23px);
      font-weight: 1000;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .result-emoji { font-size: clamp(72px, 10vw, 150px); line-height: 1; filter: drop-shadow(0 1vh .8vh rgba(100,40,0,.18)); }
    .result-image { display: none; max-width: 56%; max-height: 21vh; object-fit: contain; filter: drop-shadow(0 1vh 1vh rgba(0,0,0,.2)); }

    .result-title {
      margin: 0;
      color: var(--red);
      font-size: clamp(35px, 5.1vw, 80px);
      font-weight: 1000;
      letter-spacing: -.055em;
      line-height: .95;
      text-transform: uppercase;
    }

    .result-message { margin: 0 0 1vh; font-size: clamp(14px, 1.5vw, 23px); font-weight: 800; }

    .next-btn {
      min-width: min(330px, 55vw);
      padding: clamp(12px, 1.7vh, 20px) 3vw;
      border: .35vh solid #fff;
      border-radius: 999px;
      color: #fff;
      background: var(--red);
      box-shadow: 0 .75vh 0 var(--red-dark);
      font-size: clamp(16px, 1.7vw, 28px);
      font-weight: 1000;
      cursor: pointer;
      text-transform: uppercase;
    }

    #confetti { position: fixed; z-index: 110; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    .toast {
      position: fixed;
      z-index: 120;
      left: 50%;
      bottom: 3vh;
      padding: 1vh 2vw;
      border-radius: 99px;
      color: #fff;
      background: rgba(40,21,0,.88);
      font-weight: 800;
      transform: translate(-50%, 140%);
      transition: transform .25s ease;
    }
    .toast.show { transform: translate(-50%, 0); }

    @media (max-aspect-ratio: 5/4) {
      .app { padding-left: 14px; padding-right: 14px; }
      .header { grid-template-columns: 1fr 2fr 1fr; }
      .boxes { width: min(92vw, 850px); max-height: 64vh; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
    }

    @media (max-height: 620px) {
      .header { min-height: 58px; }
      .eyebrow { display: none; }
      .boxes { max-height: 60vh; }
      .instruction { font-size: 14px; }
      .controls { min-height: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img id="brandLogo" class="brand-logo" alt="Brand logo">
        <div id="brandFallback" class="brand-fallback">ARIANT</div>
      </div>

      <div class="headline">
        <div id="eyebrow" class="eyebrow"></div>
        <h1 id="gameTitle"></h1>
      </div>

    </header>

    <main>
      <p id="instruction" class="instruction"></p>
      <section id="boxes" class="boxes" aria-label="Six mystery boxes"></section>
    </main>

    <footer class="controls">
      <button id="newRoundBtn" class="control-btn" type="button">↻ New Round</button>
      <button id="showAllBtn" class="control-btn secondary" type="button" disabled>Show All</button>
      <button id="fullscreenBtn" class="control-btn secondary" type="button">⛶ Full Screen</button>
      <button id="soundBtn" class="control-btn sound-btn secondary" type="button" title="Sound on" aria-label="Toggle sound">🔊</button>
    </footer>
  </div>

  <div id="resultModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="result-card">
      <div class="result-kicker">You Found</div>
      <div id="resultEmoji" class="result-emoji"></div>
      <img id="resultImage" class="result-image" alt="Prize">
      <h2 id="resultTitle" class="result-title"></h2>
      <p id="resultMessage" class="result-message"></p>
      <button id="nextPlayerBtn" class="next-btn" type="button">Next Player →</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>
  <div id="toast" class="toast" role="status"></div>

    const toastEl = document.getElementById("toast");
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    let shuffledPrizes = [];
    let roundFinished = false;
    let soundEnabled = true;
    let confettiPieces = [];
    let confettiFrame = 0;
    let applauseSources = [];

    function secureRandom() {
      if (window.crypto && window.crypto.getRandomValues) {
        const value = new Uint32Array(1);
        window.crypto.getRandomValues(value);
        return value[0] / 4294967296;
      }
      return Math.random();
    }

    function shuffle(items) {
      const copy = items.map(item => Object.assign({}, item));
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(secureRandom() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function fitPrizeList() {
      const source = GAME_CONFIG.prizes.length ? GAME_CONFIG.prizes : [{ name: "Gift", emoji: "🎁", image: "" }];
      return Array.from({ length: 6 }, (_, i) => source[i % source.length]);
    }

    function renderBox(prize, index) {
      const button = document.createElement("button");
      button.className = "box-card";
      button.type = "button";
      button.dataset.index = index;
      button.setAttribute("aria-label", `Mystery box ${index + 1}`);

      const media = prize.image
        ? `<img src="${escapeHTML(prize.image)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">` +
          `<span class="emoji" style="display:none">${escapeHTML(prize.emoji || "🎁")}</span>`
        : `<span class="emoji">${escapeHTML(prize.emoji || "🎁")}</span>`;

      button.innerHTML = `
        <div class="card-inner">
          <div class="lid"></div>
          <img class="box-smile" src="${GAME_CONFIG.smileFile}" alt="Smile">
          <div class="choose-label">Choose Me</div>
          <div class="prize-inside">${media}<strong>${escapeHTML(prize.name)}</strong></div>
        </div>`;
      button.addEventListener("click", () => chooseBox(index));
      return button;
    }

    function newRound() {
      stopApplause();
      stopConfetti();
      closeModal();
      roundFinished = false;
      shuffledPrizes = shuffle(fitPrizeList());
      boxesEl.innerHTML = "";
      shuffledPrizes.map(renderBox).forEach(box => boxesEl.appendChild(box));
      showAllBtn.disabled = true;
      showToast("Gifts shuffled — ready!");
      playShuffleSound();
    }

    function chooseBox(index) {
      if (roundFinished) return;
      roundFinished = true;

      const cards = [...document.querySelectorAll(".box-card")];
      cards.forEach((card, i) => {
        card.disabled = true;
        if (i !== index) card.classList.add("not-chosen");
      });

      const selected = cards[index];
      selected.classList.add("opening");
      playOpenSound();
      // Schedule applause from the original click so strict TV browsers allow it.
      playApplauseSound(1.02);

      window.setTimeout(() => {
        selected.classList.remove("opening");
        selected.classList.add("revealed");
        showResult(shuffledPrizes[index]);
        showAllBtn.disabled = false;
      }, 1050);
    }

    function showResult(prize) {
      resultTitleEl.textContent = prize.name;
      resultMessageEl.textContent = GAME_CONFIG.revealMessage;

      if (prize.image) {
        resultImageEl.src = prize.image;
        resultImageEl.style.display = "block";
        resultEmojiEl.style.display = "none";
        resultImageEl.onerror = () => {
          resultImageEl.style.display = "none";
          resultEmojiEl.style.display = "block";
        };
      } else {
        resultImageEl.style.display = "none";
        resultEmojiEl.style.display = "block";
      }
      resultEmojiEl.textContent = prize.emoji || "🎁";
      modalEl.classList.add("show");
      nextPlayerBtn.focus();
      startConfetti();
      playWinSound();
    }

    function closeModal() {
      modalEl.classList.remove("show");
      stopConfetti();
    }

    function revealAll() {
      if (!roundFinished) return;
      closeModal();
      document.querySelectorAll(".box-card").forEach(card => {
        card.classList.remove("not-chosen", "opening");
        card.classList.add("revealed");
        card.disabled = true;
      });
      showAllBtn.disabled = true;
    }

    function escapeHTML(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove("show"), 1400);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => showToast("Full screen is not supported here"));
        } else {
          showToast("Full screen is not supported here");
        }
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function audioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx || !soundEnabled) return null;
      if (!audioContext.instance) audioContext.instance = new AudioCtx();
      if (audioContext.instance.state === "suspended") audioContext.instance.resume();
      return audioContext.instance;
    }

    function tone(frequency, start, duration, type = "sine", volume = .08) {
      const ac = audioContext();
      if (!ac) return;
      const oscillator = ac.createOscillator();
      const gain = ac.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, ac.currentTime + start);
      gain.gain.setValueAtTime(0.001, ac.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(volume, ac.currentTime + start + .02);
      gain.gain.exponentialRampToValueAtTime(.001, ac.currentTime + start + duration);
      oscillator.connect(gain).connect(ac.destination);
      oscillator.start(ac.currentTime + start);
      oscillator.stop(ac.currentTime + start + duration + .03);
    }

    function playShuffleSound() {
      [420, 520, 650].forEach((f, i) => tone(f, i * .05, .09, "sine", .035));
    }

    function playOpenSound() {
      tone(150, 0, .22, "sawtooth", .05);
      tone(320, .16, .28, "triangle", .06);
    }

    function stopApplause() {
      applauseSources.forEach(source => {
        try { source.stop(); } catch (error) { /* source already finished */ }
      });
      applauseSources = [];
    }

    function playApplauseSound(delaySeconds = 0) {
      const ac = audioContext();
      if (!ac) return;
      stopApplause();

      const applauseStart = ac.currentTime + Math.max(0, delaySeconds);
      const master = ac.createGain();
      const compressor = ac.createDynamicsCompressor();

      master.gain.setValueAtTime(.9, applauseStart);
      master.gain.setValueAtTime(.9, applauseStart + 1.8);
      master.gain.exponentialRampToValueAtTime(.08, applauseStart + 3.15);
      compressor.threshold.value = -20;
      compressor.knee.value = 18;
      compressor.ratio.value = 5;
      compressor.attack.value = .004;
      compressor.release.value = .22;
      master.connect(compressor).connect(ac.destination);

      // Dozens of short, filtered noise bursts create a natural crowd-clap effect.
      for (let group = 0; group < 19; group++) {
        const peopleInGroup = 4 + Math.floor(secureRandom() * 3);
        for (let person = 0; person < peopleInGroup; person++) {
          const duration = .075 + secureRandom() * .075;
          const sampleCount = Math.floor(ac.sampleRate * duration);
          const buffer = ac.createBuffer(1, sampleCount, ac.sampleRate);
          const samples = buffer.getChannelData(0);

          for (let i = 0; i < sampleCount; i++) {
            const time = i / ac.sampleRate;
            const firstHit = Math.exp(-time * 38);
            const secondHit = time > .018 ? .62 * Math.exp(-(time - .018) * 50) : 0;
            const thirdHit = time > .038 ? .34 * Math.exp(-(time - .038) * 62) : 0;
            samples[i] = (secureRandom() * 2 - 1) * (firstHit + secondHit + thirdHit);
          }

          const source = ac.createBufferSource();
          const filter = ac.createBiquadFilter();
          const gain = ac.createGain();
          const startAt = applauseStart + group * .145 + secureRandom() * .19;

          source.buffer = buffer;
          filter.type = "bandpass";
          filter.frequency.value = 1050 + secureRandom() * 1700;
          filter.Q.value = .35 + secureRandom() * .3;
          gain.gain.setValueAtTime(.001, startAt);
          gain.gain.linearRampToValueAtTime(.22 + secureRandom() * .16, startAt + .006);
          gain.gain.exponentialRampToValueAtTime(.001, startAt + duration);

          source.connect(filter).connect(gain).connect(master);
          source.start(startAt);
          source.stop(startAt + duration + .02);
          applauseSources.push(source);
        }
      }
    }

    function playWinSound() {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .32, "triangle", .09));
    }

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = innerWidth * ratio;
      canvas.height = innerHeight * ratio;
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function startConfetti() {
      resizeCanvas();
      const colors = ["#ffd600", "#e10600", "#ffffff", "#0756c9", "#ff7a00"];
      confettiPieces = Array.from({ length: 170 }, () => ({
        x: secureRandom() * innerWidth,
        y: -20 - secureRandom() * innerHeight * .35,
        w: 5 + secureRandom() * 10,
        h: 8 + secureRandom() * 16,
        vx: -2.8 + secureRandom() * 5.6,
        vy: 3.5 + secureRandom() * 6,
        r: secureRandom() * Math.PI,
        vr: -.15 + secureRandom() * .3,
        color: colors[Math.floor(secureRandom() * colors.length)]
      }));
      cancelAnimationFrame(confettiFrame);
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let active = false;
      for (const p of confettiPieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += .035;
        p.r += p.vr;
        if (p.y < innerHeight + 30) active = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (active) confettiFrame = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      cancelAnimationFrame(confettiFrame);
      confettiPieces = [];
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }

    function applyConfig() {
      document.title = GAME_CONFIG.browserTabTitle;
      document.getElementById("eyebrow").textContent = GAME_CONFIG.eyebrow;
      document.getElementById("gameTitle").textContent = GAME_CONFIG.title;
      document.getElementById("instruction").innerHTML = GAME_CONFIG.instruction;

      const logo = document.getElementById("brandLogo");
      const fallback = document.getElementById("brandFallback");
      fallback.textContent = GAME_CONFIG.fallbackLogoText;
      logo.src = GAME_CONFIG.logoFile;
      logo.onload = () => { logo.style.display = "block"; fallback.style.display = "none"; };
      logo.onerror = () => { logo.style.display = "none"; fallback.style.display = "block"; };
    }

    newRoundBtn.addEventListener("click", newRound);
    nextPlayerBtn.addEventListener("click", newRound);
    showAllBtn.addEventListener("click", revealAll);
    fullscreenBtn.addEventListener("click", toggleFullscreen);
    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
      soundBtn.title = soundEnabled ? "Sound on" : "Sound off";
      if (soundEnabled) playShuffleSound();
      else stopApplause();
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.textContent = document.fullscreenElement ? "✕ Exit Full Screen" : "⛶ Full Screen";
    });

    document.addEventListener("keydown", event => {
      if (event.key >= "1" && event.key <= "6" && !roundFinished) {
        chooseBox(Number(event.key) - 1);
      } else if (event.key.toLowerCase() === "r") {
        newRound();
      } else if (event.key.toLowerCase() === "f") {
        toggleFullscreen();
      } else if (event.key === "Escape" && modalEl.classList.contains("show")) {
        closeModal();
      } else if ((event.key === "Enter" || event.key === " ") && modalEl.classList.contains("show")) {
        event.preventDefault();
        newRound();
      }
    });

    window.addEventListener("resize", resizeCanvas);
    applyConfig();
    newRound();
  </script>
</body>
</html>
